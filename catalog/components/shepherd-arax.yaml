# ARAX (shepherd-arax)
#
# One Translator component. Fields hold *pointers* to the places that already
# know about this component; see ../README.md for how to fill them in and
# ../../docs/metadata-sources.md for what each of those places offers.
#
# A field that is absent has not been recorded yet. A field that is explicitly
# `null` has been checked and does not exist.
# yaml-language-server: $schema=../schema/component.schema.json

id: shepherd-arax
name: ARAX
description: |-
  Contains ARAX, ARAGORN and BTE
owner: CATRAX
component_type: ARA
refactor_status: New in Refactor
layer: Shepherd
part_of: Shepherd
hosted_at: ITRB

identifiers:
  infores: infores:shepherd-arax
  smartapi: "355d9ca56f4a528ce43c56ae19c97676"
  helm_chart: shepherd
  otel_services:
    - arax
    - arax.pathfinder

itrb:
  app: shepherd-ci-pipeline
  group: shepherd

connections:
  gets_results_from: [retriever]
  # nodenorm-es: ARAX is the only Shepherd service that calls NodeNorm, and
  # its team is working on removing the query-time calls
  # (https://github.com/RTXteam/RTX/issues/2855 and
  # https://github.com/RTXteam/RTX/issues/2896). The call is probably made by
  # one of the Shepherd components it goes through, but those have no files
  # of their own yet (translator-diagram#3), so it is recorded here until
  # they do.
  calls: [nodenorm-es, jaeger]
  externals: []

repositories:
  - url: https://github.com/BioPack-team/shepherd
    role: source
    visibility: public
  - url: https://github.com/helxplatform/translator-devops/tree/develop/helm/shepherd
    role: helm-chart
    visibility: public
