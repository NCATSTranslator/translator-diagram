name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject's requires-python, and the current release.
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      # --locked fails if uv.lock is out of date with pyproject.toml, rather
      # than silently resolving something else.
      - run: uv sync --locked

      # No apt-get install graphviz: nothing here renders a diagram. The tests
      # assert on the DOT source that build_graph produces, so the layout
      # binary is only needed when someone actually generates output.
      - run: uv run pytest

      - run: uv run ruff check

      - run: uv run rumdl check .
