# Refresh content/ from a fresh sync, and open a pull request with the result.
#
# This workflow never writes to main. It builds on a branch of its own,
# `refresh-content`, and opens or updates one pull request from it; a person
# reads the diff and merges. Two things make that structural rather than a
# convention: the job's token can write contents and pull requests but main
# is protected and requires a pull request, and create-pull-request pushes
# to the branch it is told and nowhere else. A quiet day -- a sync that
# changed no file -- opens nothing, because nothing generated here carries a
# timestamp (see content.py).
#
# The alternatives, and why this one, are in docs/public-private-split.md.
#
# Manual only until the repository is private: the schedule below is what a
# private repository would run, and is commented out rather than absent so
# that enabling it is a one-line change and the cadence is on record.
name: Refresh content

on:
  workflow_dispatch:
  # schedule:
  #   # Daily, an hour after the Pages build, so the page and the files come
  #   # from syncs of the same morning. Enable when the repository is private.
  #   - cron: "0 8 * * *"

permissions:
  contents: read

concurrency:
  group: refresh-content
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      # The diagram is the one output that needs a system package. ci.yml
      # deliberately does not install it, because the tests assert on DOT
      # source rather than on a rendered picture; this job wants the picture.
      - name: Install Graphviz
        run: sudo apt-get update -qq && sudo apt-get install -y -qq graphviz

      - name: Fetch what the component files point at
        env:
          # api.github.com only, by _headers in sync.py.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run sync-components

      - name: Build the content tree
        run: uv run build-content --diagram

      # Opens the pull request, or updates the open one, or does nothing when
      # content/ is unchanged. The branch is fixed so there is only ever one.
      - uses: peter-evans/create-pull-request@v8
        with:
          branch: refresh-content
          delete-branch: true
          add-paths: content/
          commit-message: Refresh content/ from today's sync
          title: Refresh content/ from today's sync
          body: |
            Generated by the `Refresh content` workflow from a fresh
            `sync-components` run. Nothing here was edited by hand; the diff
            is what changed in the platform since the last merge.

            Review it as data: a version that moved, an environment that
            stopped answering, a release that appeared. Merge when it reads
            right. If a change looks wrong, the fix is in the source it was
            read from or in `components/`, not in these files.
