# Build the dashboard, and publish it from main.
#
# Deploys from main only: a push, the daily schedule, or a manual run on main,
# and each of those deploys. A manual run on any other branch builds the page
# and uploads it as an artifact to download and open, and deploys nothing. That
# is the way to review a branch's page as GitHub builds it before merging; the
# commands are in README.md, "The components dashboard".
#
# Pull requests do not trigger it. A PR is pushed to dozens of times before it
# merges, and each build is a full sync -- about 240 requests to live
# Translator services and 46 GitHub API calls -- of a commit that is usually
# superseded within minutes; a local build answers the same question. What a
# PR build caught that ci.yml's tests do not, a failure against live data, is
# caught as safely on main: deploy needs a successful build, so a failed one
# leaves the published page as it was.
#
# A branch cannot deploy, by design and by configuration: the github-pages
# environment allows deployments from main only, so a deploy job on another
# branch would be refused even if this file asked for one. Deploying a branch
# for review would also overwrite the live site with it, and this page reads
# live versions, so what it shows depends on when it ran as much as on what it
# was built from.
#
# Neither job passes --include-private, so both apply config/privacy.yaml. That
# is the point of redacting by default: this file cannot be edited into
# publishing a full build by leaving a flag out.
name: Dashboard

on:
  push:
    branches: [main]
  schedule:
    # Daily. The data changes when someone deploys, not when we push.
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Deploys serialise and are never cancelled half-way: the artifact a cancelled
# run leaves behind is the one the next deploy would publish. A manual build of
# another branch is the opposite case -- it only produces an artifact to
# download, and a build of a commit already pushed past is worth nothing -- so
# it gets a group per branch and cancels freely, without queueing behind main.
concurrency:
  group: pages-${{ github.ref == 'refs/heads/main' && 'deploy' || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true
          python-version: "3.13"

      - run: uv sync --locked

      - name: Fetch what the component files point at
        env:
          # Sent to api.github.com only, by _headers in fetch.py. Raises the
          # API budget from 60 calls an hour to 5000; one sync spends about 46
          # (the breakdown is above _source_repos in sync.py).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A service being down is data, not an error — sync exits non-zero only
        # if it could not fetch anything at all. Read the step's output rather
        # than its exit code: Translator's ci and test hosts may not be
        # reachable from a runner, and that shows up as a quieter page.
        run: uv run sync-components

      - name: Build the page
        # No --include-private: config/privacy.yaml applies, and build-dashboard
        # verifies its own output before writing.
        run: uv run build-dashboard

      # The downloadable copy is for reviewing a branch. main publishes the
      # same directory through upload-pages-artifact below, and the live site
      # is its copy, so a second upload there would only be stored twice.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.ref != 'refs/heads/main'
        with:
          name: dashboard
          path: data/dashboard/
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main'
        with:
          path: data/dashboard/

  deploy:
    needs: build
    # main and nothing else, whichever of the three events started the run.
    # The github-pages environment enforces the same rule from its side.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
