# Translator UI (ui)
#
# One Translator component. Fields hold *pointers* to the places that already
# know about this component; see docs/component-metadata.md for the format and
# docs/metadata-sources.md for what each of those places actually offers.
#
# A field that is absent has not been recorded yet. A field that is explicitly
# `null` has been checked and does not exist.
# yaml-language-server: $schema=../schema/component.schema.json

id: ui
name: Translator UI
owner: UI
refactor_status: Continues into Refactor
layer: ARS and UI
hosted_at: ITRB

itrb:
  app: translator-ui-ci-pipeline
  group: UI

connections:
  gets_results_from: [ars]
  calls: [docmetadata-api, name-lookup]
  externals:
    - direction: out
      name: User

repositories:
  - url: https://github.com/NCATSTranslator/ui-fe
    role: source
    visibility: public
  - url: https://github.com/NCATSTranslator/ui-be
    role: source
    visibility: public

endpoints:
  # Checked on 2026-09-01, all four environments: the UI answers *any* path
  # with the app's own HTML and a 200, so a fetcher aiming at openapi.json
  # gets a page that looks like a success and parses as nothing. Worse than a
  # 404, and the reason this is null rather than absent.
  openapi: null

environments:
  # Not an ITRB hostname and not derivable from the others: the dev UI lives
  # in NCATS' own namespace, which is why nothing found it automatically.
  dev:
    url: https://transltr-bma-ui-dev.ncats.io/
  ci:
    url: https://ui.ci.transltr.io/
    location: ITRB
  test:
    url: https://ui.test.transltr.io/
    location: ITRB
  prod:
    url: https://ui.transltr.io/
    location: ITRB
