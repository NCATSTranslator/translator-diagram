# KGX Storage (kgx-storage-pipeline)
#
# One Translator component. Fields hold *pointers* to the places that already
# know about this component; see docs/component-metadata.md for the format and
# docs/metadata-sources.md for what each of those places actually offers.
#
# A field that is absent has not been recorded yet. A field that is explicitly
# `null` has been checked and does not exist.
# yaml-language-server: $schema=../schema/component.schema.json

id: kgx-storage-pipeline
name: KGX Storage
owner: DINGO
refactor_status: New in Refactor
layer: KGX Storage
hosted_at: ITRB

itrb:
  app: kgx-storage-pipeline
  group: KGX

connections:
  gets_results_from: [dingo-ingest]
  calls: []
  externals: []

repositories:
  - url: https://github.com/RTXteam/kgx-storage
    role: source
    visibility: public

endpoints:
  # Checked on 2026-09-02: / and /docs are HTML, /health is JSON, and
  # /openapi.json and /status are both 404. This is a file server, not an API
  # service, so there is no OpenAPI document to find.
  openapi: null
  status: health

environments:
  ci:
    url: https://kgx-storage.ci.transltr.io/
    location: ITRB

notes: >-
  A file browser over the Translator ingests, with a JSON health endpoint at
  /health reporting how many metrics it has loaded. It publishes no version
  anywhere — not at /health, not in a document, and it is in no registry — so
  its cell shows the health it reports and no version number.
