# repository: components.py never parses the key, so it cannot reach
# overview.json or the published page, and `build-content` is the only thing
# that reads it. While this repository is public every value is the literal
# string PRIVATE; real values go in only once it is private.
private:
  contacts:
    - PRIVATE
  internal_hosts:
    - PRIVATE
  notes: PRIVATE
