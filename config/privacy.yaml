# What a published build of the dashboard withholds.
#
# `build-dashboard` reads this file and applies it by default; pass
# --include-private to build the full page for local use. See privacy.py for
# why redaction is the default, and for the important caveat: this is about
# reach, not secrecy. This file is in a public repository and names what it
# withholds. It keeps things off an indexed page; it does not hide them from
# anyone who looks, and a fact that is genuinely too sensitive to publish has
# to be fixed at the API that served it, not here.
#
# An entry that matches nothing is an error, not a no-op — a renamed component
# must not silently stop being withheld. tests/test_privacy.py enforces it.

# Whole rows, dropped from the table and from overview.json.
components:
  - id: jaeger
    reason: >-
      The OpenTelemetry tracing console. Its row links translator-otel.{ci,test,}
      .transltr.io, which is an internal operations tool and the clearest
      "internal system" on the page.
  - id: test-harness
    reason: >-
      The internal test rig, down to where it runs. Nothing about it is useful
      to someone integrating with Translator.

# Row fields, emptied on every remaining row. Emptied rather than deleted:
# overview.json's shape is a contract.
fields:
  - name: helm_images
    reason: >-
      Container image tags (solr:9.1, renci-python-image:latest, ...). Beside
      the version grid they make a ready-made inventory to match against a CVE
      feed, with nothing to probe. The drawer does render Helm now, but out of
      the public `helm_charts` block, which carries capacity — replicas,
      requests, limits, storage — and never an image repository or tag;
      tests/test_payload_details.py scans every cached chart's real output to
      keep it that way.

# `helm_version` was withheld here until the drawer was built, and is not any
# more. The chart's appVersion is a claim about what *should* be deployed, it
# is public in helxplatform/translator-devops, and it is not where the image
# tags come from — so withholding it emptied that field on the six published
# rows that record a chart while protecting nothing, and would have blanked any
# cell whose version came from one. privacy.FIELD_VERSION_SOURCES narrowed at
# the same time: only a field a cell actually read its version from belongs in
# that map, which `helm_images` never was.

# Per-environment cell fields. None today. The candidates if the health
# signals turn out to be too much are `uptime`, `http_status` and `status_url`
# — see the checklist on PR #21 — and now six more that arrived with the
# drawer: `openapi_title`, `trapi_operations`, `asyncquery`, `paths_count`,
# `status_message` and `recent_queries`. All six are read from the endpoint's
# own public document, and `recent_queries` is the only one that says anything
# about usage rather than shape: a count and two latencies, no per-query
# detail. Withhold that one first if any of them ever needs withholding.
environment_fields: []

# Considered and deliberately not withheld:
#
#   otel_services      Internal service naming, but the page's OTel counts are
#                      a finding about registration discipline, and the names
#                      are already in components/*.yaml and unknown.yaml.
#   environments.*.url The deployment hosts. Every one on the page today is
#                      either recorded in this repo or listed in the public
#                      SmartAPI registry, and they are what makes a version
#                      claim checkable by the reader.
#   helm_charts        What each chart asks Kubernetes for. Read from
#                      helxplatform/translator-devops, which is public, and it
#                      is capacity rather than inventory: how many replicas and
#                      how much memory, with no image to match a CVE against.
#   helm_charts[].ingress_hosts
#                      Chart *defaults*, not what ITRB deploys with, and
#                      labelled as such wherever they are shown. The
#                      placeholders charts write here (`fillthisin`,
#                      `ingress_HOST`) are dropped rather than published as
#                      hostnames.
#   smartapi_record.contact
#                      A name and an email, already public in the SmartAPI
#                      registry entry this repo links to by id. Worth noting
#                      that `fields:` could not empty it if we wanted to: it
#                      names a whole row field, and reaching one key inside a
#                      block would need nested-path support in
#                      privacy._redactions.
#   edges, stages, connections
#                      Which component calls which, computed from the
#                      `connections:` blocks in this public repository. A
#                      withheld component is still absent from all three: they
#                      are built from the rows the policy left behind, and
#                      `connections` is pruned of withheld ids in privacy.apply.
