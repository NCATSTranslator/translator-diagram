[project]
name = "translator-diagram"
version = "0.1.0"
description = "Generate dependency diagrams for Translator platform components"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "graphviz>=0.20",
    "python-dotenv>=1.0",
    # The dashboard reads components/*.yaml at runtime. jsonschema stays in the
    # dev group: nothing but the tests validates those files.
    "pyyaml>=6.0",
]

[project.scripts]
generate-diagram = "translator_diagram.cli:main"
sync-components = "translator_diagram.dashboard_cli:sync_main"
build-dashboard = "translator_diagram.dashboard_cli:build_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.5",
    "rumdl>=0.2.62",
    "jsonschema>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package carries its own copy of owner-colors.csv in data/, plus the
# dashboard's CSS and JS, so an installed copy works without a checkout to read
# them from. Naming the package directory keeps .git/, data/, tests/ and
# .venv/ out of the build.
packages = ["src/translator_diagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.rumdl]
# Code blocks hold CLI help text and a directory tree, both of which are
# reproductions rather than prose — rewrapping them would make them wrong.
[tool.rumdl.MD013]
code_blocks = false
