[project]
name = "translator-diagram"
version = "0.1.0"
description = "Generate dependency diagrams for Translator platform components"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "graphviz>=0.20",
    "python-dotenv>=1.0",
]

[project.scripts]
generate-diagram = "generate_diagram:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The module and its owner-colors.csv must land side by side in the wheel:
# DEFAULT_OWNER_COLORS_PATH resolves the CSV relative to __file__. Listing
# them explicitly also keeps .git/, data/, tests/ and .venv/ out of the build,
# which "packages = [.]" would sweep in now that the layout is flat.
only-include = ["generate_diagram.py", "owner-colors.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
