[project]
name = "translator-components-diagram"
version = "0.1.0"
description = "Generate dependency diagrams for Translator platform components"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "graphviz>=0.20",
]

[project.scripts]
generate-diagram = "generate_diagram:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
