[project]
name = "translator-diagram"
version = "0.1.0"
description = "Generate dependency diagrams for Translator platform components"
requires-python = ">=3.11"
dependencies = [
    "click>=8.0",
    "graphviz>=0.20",
    "python-dotenv>=1.0",
]

[project.scripts]
generate-diagram = "translator_diagram.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The package carries its own copy of owner-colors.csv in data/, so an
# installed copy has colours without a checkout to read them from. Naming the
# package directory keeps .git/, data/, tests/ and .venv/ out of the build.
packages = ["src/translator_diagram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
